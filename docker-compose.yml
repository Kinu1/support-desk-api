services:
  api:
    build:
      context: .
      target: production
    container_name: support-desk-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-support_desk}:${POSTGRES_PASSWORD:-support_desk_password}@postgres:5432/${POSTGRES_DB:-support_desk}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret_32_chars}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: support-desk-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support_desk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_desk_password}
      POSTGRES_DB: ${POSTGRES_DB:-support_desk}
    volumes:
      - support_desk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support_desk} -d ${POSTGRES_DB:-support_desk}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  support_desk_postgres_data:
