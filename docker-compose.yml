services:
  postgres:
    image: postgres:16-alpine
    container_name: support-desk-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support_desk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_desk_password}
      POSTGRES_DB: ${POSTGRES_DB:-support_desk}
    volumes:
      - support_desk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support_desk} -d ${POSTGRES_DB:-support_desk}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  support_desk_postgres_data:
